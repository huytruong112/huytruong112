<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quản lý khách hàng</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Dashboard quản lý</h1>
            <p>Quản lý khách hàng và subscription</p>
        </header>

        <nav>
            <a href="/">Đăng ký</a>
            <a href="/dashboard" class="active">Quản lý</a>
        </nav>

        <main>
            <div class="card">
                <h2>👥 Danh sách khách hàng</h2>
                
                <div class="search-box">
                    <input type="text" id="searchBox" placeholder="Tìm kiếm theo email hoặc tên...">
                    <button onclick="loadCustomers()" class="btn btn-primary">🔄 Làm mới</button>
                </div>

                <div id="customersTable" class="table-container">
                    <p class="loading">Đang tải dữ liệu...</p>
                </div>
            </div>

            <!-- Customer Detail Modal -->
            <div id="customerModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="close" onclick="closeModal()">&times;</span>
                    <h2>Chi tiết khách hàng</h2>
                    <div id="customerDetail"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2025 VPN Management System | Powered by X-UI/3X-UI</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
