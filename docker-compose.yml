version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/vpn_service
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./:/app

  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=vpn_service
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"

volumes:
  postgres_data:
