<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dịch Vụ VPN - Mua Gói Dịch Vụ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .auth-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: #f0f0f0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .auth-tab.active {
            background: #667eea;
            color: white;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .package-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s;
        }

        .package-card:hover {
            transform: translateY(-5px);
        }

        .package-card h3 {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .package-card .price {
            font-size: 2em;
            color: #333;
            margin: 20px 0;
            font-weight: bold;
        }

        .package-card .price span {
            font-size: 0.5em;
            color: #666;
        }

        .package-card ul {
            list-style: none;
            margin: 20px 0;
        }

        .package-card ul li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .package-card ul li:last-child {
            border-bottom: none;
        }

        .my-services {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .my-services h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .service-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .service-item h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .service-item .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .service-item .info-item {
            display: flex;
            flex-direction: column;
        }

        .service-item .info-item label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .service-item .info-item value {
            font-weight: 600;
            color: #333;
        }

        .connection-url {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-expired {
            background: #fed7d7;
            color: #742a2a;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .alert-error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        .hidden {
            display: none !important;
        }

        .user-info {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info h3 {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Dịch Vụ VPN Premium</h1>
            <p>Kết nối an toàn, tốc độ cao, ổn định</p>
        </header>

        <!-- Auth Section (Login/Register) -->
        <div id="authSection" class="auth-section">
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Đăng Nhập</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Đăng Ký</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Đăng Nhập</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" name="phone">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Đăng Ký</button>
            </form>
        </div>

        <!-- User Info (shown when logged in) -->
        <div id="userInfo" class="user-info hidden">
            <div>
                <h3 id="userName">Chào mừng!</h3>
                <p id="userEmail"></p>
            </div>
            <button class="btn btn-danger" onclick="handleLogout()">Đăng Xuất</button>
        </div>

        <!-- Alert Messages -->
        <div id="alertContainer"></div>

        <!-- Packages Section -->
        <div id="packagesSection" class="hidden">
            <h2 style="color: white; margin-bottom: 20px; text-align: center;">Chọn Gói Dịch Vụ</h2>
            <div id="packagesGrid" class="packages-grid"></div>
        </div>

        <!-- My Services Section -->
        <div id="myServicesSection" class="my-services hidden">
            <h2>Dịch Vụ Của Tôi</h2>
            <div id="servicesList"></div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('authToken');
        let currentUser = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (authToken) {
                verifyToken();
            }
            loadPackages();
        });

        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: formData.get('email'),
                        password: formData.get('password')
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    currentUser = data.customer;
                    showAlert('Đăng nhập thành công!', 'success');
                    updateUI();
                    loadMyServices();
                } else {
                    showAlert(data.error || 'Đăng nhập thất bại', 'error');
                }
            } catch (error) {
                showAlert('Lỗi kết nối server', 'error');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: formData.get('name'),
                        email: formData.get('email'),
                        phone: formData.get('phone'),
                        password: formData.get('password')
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    showAlert('Đăng ký thành công!', 'success');
                    updateUI();
                    loadMyServices();
                } else {
                    showAlert(data.error || 'Đăng ký thất bại', 'error');
                }
            } catch (error) {
                showAlert('Lỗi kết nối server', 'error');
            }
        }

        function handleLogout() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem('authToken');
            updateUI();
            showAlert('Đã đăng xuất', 'success');
        }

        async function verifyToken() {
            // Simple token verification - you can implement a proper endpoint
            if (authToken) {
                updateUI();
                loadMyServices();
            }
        }

        function updateUI() {
            if (authToken) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('packagesSection').classList.remove('hidden');
                document.getElementById('myServicesSection').classList.remove('hidden');
                
                if (currentUser) {
                    document.getElementById('userName').textContent = `Chào mừng, ${currentUser.name}!`;
                    document.getElementById('userEmail').textContent = currentUser.email;
                }
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('hidden');
                document.getElementById('packagesSection').classList.add('hidden');
                document.getElementById('myServicesSection').classList.add('hidden');
            }
        }

        async function loadPackages() {
            try {
                const response = await fetch('/api/packages');
                const data = await response.json();
                
                const grid = document.getElementById('packagesGrid');
                grid.innerHTML = data.packages.map(pkg => `
                    <div class="package-card">
                        <h3>${pkg.name}</h3>
                        <p>${pkg.description}</p>
                        <div class="price">${formatPrice(pkg.price)} <span>VNĐ</span></div>
                        <ul>
                            <li>⏱️ Thời hạn: ${pkg.duration_days} ngày</li>
                            <li>📊 Dung lượng: ${pkg.data_limit_gb ? pkg.data_limit_gb + ' GB' : 'Không giới hạn'}</li>
                            <li>🔗 Số kết nối: ${pkg.max_connections}</li>
                        </ul>
                        <button class="btn btn-success" onclick="buyPackage(${pkg.id})" ${!authToken ? 'disabled' : ''}>
                            ${authToken ? 'Mua Ngay' : 'Đăng nhập để mua'}
                        </button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Lỗi load packages:', error);
            }
        }

        async function buyPackage(packageId) {
            if (!authToken) {
                showAlert('Vui lòng đăng nhập để mua gói dịch vụ', 'error');
                return;
            }
            
            if (!confirm('Bạn có chắc muốn mua gói dịch vụ này?')) {
                return;
            }
            
            try {
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        packageId: packageId,
                        paymentMethod: 'manual'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Mua gói dịch vụ thành công! Client đã được tạo tự động.', 'success');
                    loadMyServices();
                } else {
                    showAlert(data.error || 'Lỗi mua gói dịch vụ', 'error');
                }
            } catch (error) {
                showAlert('Lỗi kết nối server', 'error');
            }
        }

        async function loadMyServices() {
            if (!authToken) return;
            
            try {
                const response = await fetch('/api/my-services', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                const data = await response.json();
                
                const list = document.getElementById('servicesList');
                if (data.services.length === 0) {
                    list.innerHTML = '<p>Bạn chưa có dịch vụ nào.</p>';
                } else {
                    list.innerHTML = data.services.map(service => `
                        <div class="service-item">
                            <h4>${service.package_name}</h4>
                            <span class="status-badge ${service.status === 'active' ? 'status-active' : 'status-expired'}">
                                ${service.status === 'active' ? 'Đang hoạt động' : 'Hết hạn'}
                            </span>
                            <div class="info">
                                <div class="info-item">
                                    <label>Email:</label>
                                    <value>${service.email}</value>
                                </div>
                                <div class="info-item">
                                    <label>Hết hạn:</label>
                                    <value>${new Date(service.expiry_date).toLocaleDateString('vi-VN')}</value>
                                </div>
                                <div class="info-item">
                                    <label>Dung lượng:</label>
                                    <value>${service.data_limit_gb ? service.data_limit_gb + ' GB' : 'Không giới hạn'}</value>
                                </div>
                            </div>
                            <div class="connection-url">
                                <strong>URL kết nối:</strong><br>
                                ${service.connection_url}
                            </div>
                            <div class="connection-url" style="margin-top: 10px;">
                                <strong>URL subscription:</strong><br>
                                ${service.subscription_url}
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Lỗi load services:', error);
            }
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('vi-VN').format(price);
        }
    </script>
</body>
</html>
